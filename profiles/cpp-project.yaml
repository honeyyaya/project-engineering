profile: cpp-project
version: "0.2"
status: experimental
description: "面向通用 C++ 仓库的基础工程能力组合。"
extends: []
domains: [architecture, module-boundaries, cpp, testing, review, migration, documentation]
standards:
  - policies/cpp.md
  - policies/naming.md
  - policies/error-handling.md
  - policies/complexity.md
  - policies/dependency-rules.md
  - policies/layering.md
skills:
  candidates: [addy.context-engineering, addy.constraint-driven-development, addy.api-and-interface-design, addy.source-driven-development, addy.code-review-and-quality, addy.documentation-and-adrs]
  conditional: [addy.interview-me, addy.spec-driven-development, addy.incremental-implementation, addy.doubt-driven-development, addy.code-simplification, addy.deprecation-and-migration]
superpowers:
  candidates: [superpowers.brainstorming, superpowers.writing-plans, superpowers.executing-plans, superpowers.test-driven-development, superpowers.systematic-debugging, superpowers.verification-before-completion, superpowers.requesting-code-review, superpowers.receiving-code-review]
  conditional: [superpowers.subagent-driven-development, superpowers.dispatching-parallel-agents, superpowers.using-git-worktrees, superpowers.finishing-a-development-branch]
workflows:
  new_project: workflow/new-project.md
  feature: stack/project-engineering.yaml#default_workflows.feature
  behavior_preserving_refactor: stack/project-engineering.yaml#default_workflows.behavior_preserving_refactor
  review: stack/project-engineering.yaml#default_workflows.code_review
quality_gates:
  requirement: workflow/requirement.md
  architecture: workflow/architecture-gate.md
  implementation: workflow/implementation-gate.md
  test: workflow/test-gate.md
  review: workflow/review-gate.md
outputs:
  required: [requirements-brief, implementation-plan, TEST_PLAN, REVIEW, verification-summary]
  conditional: [ADR, migration-plan, technical-debt-entry]
  evidence_root: .engineering/
guard:
  base_features: [cpp]
  risk_catalog: registry/risks.yaml
  gate_catalog: registry/gates.yaml
  component_policy: {s1_modes: [reference, evaluation], default_maturity: S4}
