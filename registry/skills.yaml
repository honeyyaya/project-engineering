schema_version: "0.1"
kind: skill-registry
description: "Skill 级主索引；原始内容保存在 sources/，这里只记录映射、采用策略和证据。"
adoption_modes:
  adopt: "直接纳入本地组合。"
  compose: "与 primary 能力协同，不复制其职责。"
  reference: "仅作参考或基准。"
  conditional: "满足项目、Harness 或风险条件时启用。"
  reject: "明确不采用并记录原因。"
maturity_levels: {S0: Candidate, S1: Reviewed, S2: Tested, S3: Proven, S4: Core}
activation_policy: "profile_candidate 仅表示 Profile 候选；S1 显式 reference/evaluation，只有 S4 可 default。"

skills:
  - id: superpowers.brainstorming
    name: Brainstorming
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/brainstorming/SKILL.md, license: MIT}
    capability: [requirements, discovery, option-analysis]
    lifecycle: [requirement, architecture, design]
    adoption: adopt
    project_engineering: [workflow.requirement, governance.architecture]
    activation: {when: "需求有歧义或方案空间较大", profile_candidate: true}
    composition: {role: workflow-manager, pairs_with: [addy.interview-me, addy.idea-refine], outputs: [requirements-brief, decision-record]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.writing-plans
    name: Writing Plans
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/writing-plans/SKILL.md, license: MIT}
    capability: [planning, task-breakdown, verification-planning]
    lifecycle: [plan]
    adoption: adopt
    project_engineering: [workflow.implementation-gate, templates.TEST_PLAN]
    activation: {when: "实现包含多个步骤、模块或迁移风险", profile_candidate: true}
    composition: {role: workflow-manager, pairs_with: [addy.spec-driven-development, addy.incremental-implementation], outputs: [implementation-plan]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.executing-plans
    name: Executing Plans
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/executing-plans/SKILL.md, license: MIT}
    capability: [implementation, checkpointing, progress-control]
    lifecycle: [implementation]
    adoption: adopt
    project_engineering: [workflow.implementation-gate]
    activation: {when: "已有经过审查的实施计划", profile_candidate: true}
    composition: {role: workflow-manager, requires: [superpowers.writing-plans], pairs_with: [superpowers.test-driven-development], outputs: [execution-log]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.test-driven-development
    name: Test-Driven Development
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/test-driven-development/SKILL.md, license: MIT}
    capability: [testing, feedback-loop, regression-prevention]
    lifecycle: [plan, implementation, test]
    adoption: adopt
    project_engineering: [workflow.test-gate, roles.test-engineer]
    activation: {when: "新增行为、修复缺陷或需要行为保持证据", profile_candidate: true}
    composition: {role: test-engineer, primary_for: [addy.test-driven-development], outputs: [failing-test, passing-test, regression-evidence]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.systematic-debugging
    name: Systematic Debugging
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/systematic-debugging/SKILL.md, license: MIT}
    capability: [debugging, hypothesis-testing, root-cause-analysis]
    lifecycle: [implementation, test, review]
    adoption: adopt
    project_engineering: [workflow.test-gate, governance.review]
    activation: {when: "测试失败、运行时异常或根因未知", profile_candidate: true}
    composition: {role: test-engineer, primary_for: [addy.debugging-and-error-recovery], requires: [superpowers.verification-before-completion], outputs: [root-cause-record, fix-evidence]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.verification-before-completion
    name: Verification Before Completion
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/verification-before-completion/SKILL.md, license: MIT}
    capability: [verification, evidence, completion-criteria]
    lifecycle: [test, review, delivery]
    adoption: adopt
    project_engineering: [workflow.review-gate, workflow.test-gate]
    activation: {when: "准备宣称任务完成或交付可用", profile_candidate: true}
    composition: {role: workflow-manager, wraps: [superpowers.test-driven-development, governance.review], outputs: [verification-summary]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.requesting-code-review
    name: Requesting Code Review
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/requesting-code-review/SKILL.md, license: MIT}
    capability: [review, reviewer-dispatch, change-summary]
    lifecycle: [review]
    adoption: adopt
    project_engineering: [workflow.review-gate, templates.REVIEW]
    activation: {when: "实现完成且需要独立审查", profile_candidate: true}
    composition: {role: code-reviewer, pairs_with: [addy.code-review-and-quality, fluidframework-review], outputs: [review-request]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.receiving-code-review
    name: Receiving Code Review
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/receiving-code-review/SKILL.md, license: MIT}
    capability: [review-response, issue-triage, correction]
    lifecycle: [review, delivery]
    adoption: adopt
    project_engineering: [workflow.review-gate]
    activation: {when: "收到审查意见或质量门反馈", profile_candidate: true}
    composition: {role: code-reviewer, requires: [superpowers.verification-before-completion], outputs: [review-resolution]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.subagent-driven-development
    name: Subagent-Driven Development
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/subagent-driven-development/SKILL.md, license: MIT}
    capability: [delegation, implementation, review]
    lifecycle: [plan, implementation, review]
    adoption: conditional
    project_engineering: [workflow.routing]
    activation: {when: "Harness 支持子 Agent 且任务可安全拆分", profile_candidate: false}
    composition: {role: workflow-manager, pairs_with: [superpowers.executing-plans, superpowers.requesting-code-review], constraints: [isolated-context, explicit-contract]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.dispatching-parallel-agents
    name: Dispatching Parallel Agents
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/dispatching-parallel-agents/SKILL.md, license: MIT}
    capability: [parallelization, delegation, throughput]
    lifecycle: [plan, implementation, review]
    adoption: conditional
    project_engineering: [workflow.routing]
    activation: {when: "任务之间无共享写入和顺序依赖", profile_candidate: false}
    composition: {role: workflow-manager, requires: [superpowers.subagent-driven-development], constraints: [independent-work-units]}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.using-git-worktrees
    name: Using Git Worktrees
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/using-git-worktrees/SKILL.md, license: MIT}
    capability: [workspace-isolation, branch-safety]
    lifecycle: [plan, implementation]
    adoption: conditional
    project_engineering: [workflow.routing]
    activation: {when: "需要并行分支或 Harness 没有原生隔离", profile_candidate: false}
    composition: {role: workflow-manager, pairs_with: [superpowers.finishing-a-development-branch], harness_dependent: true}
    maturity: S1
    evidence: sources/github/superpowers/audit.md
  - id: superpowers.finishing-a-development-branch
    name: Finishing a Development Branch
    source: {id: superpowers, path: sources/github/superpowers/ORIGINAL/skills/finishing-a-development-branch/SKILL.md, license: MIT}
    capability: [delivery, branch-lifecycle, integration]
    lifecycle: [delivery]
    adoption: conditional
    project_engineering: [workflow.review-gate]
    activation: {when: "Harness 授权合并、推送或创建 PR", profile_candidate: false}
    composition: {role: workflow-manager, requires: [superpowers.verification-before-completion], harness_dependent: true}
    maturity: S1
    evidence: sources/github/superpowers/audit.md

  - id: addy.interview-me
    name: Interview Me
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/interview-me/SKILL.md, license: MIT}
    capability: [requirements, elicitation, ambiguity-reduction]
    lifecycle: [requirement]
    adoption: compose
    project_engineering: [workflow.requirement]
    activation: {when: "需求信息不足且需要结构化追问", profile_candidate: true}
    composition: {role: workflow-manager, primary: superpowers.brainstorming, outputs: [clarified-requirements]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.idea-refine
    name: Idea Refine
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/idea-refine/SKILL.md, license: MIT}
    capability: [requirements, option-analysis, scope-control]
    lifecycle: [requirement, architecture]
    adoption: compose
    project_engineering: [workflow.requirement, governance.architecture]
    activation: {when: "想法未形成可执行问题定义", profile_candidate: true}
    composition: {role: architect, primary: superpowers.brainstorming, outputs: [problem-statement, scope]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.spec-driven-development
    name: Spec-Driven Development
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/spec-driven-development/SKILL.md, license: MIT}
    capability: [specification, acceptance-criteria, traceability]
    lifecycle: [requirement, design, plan]
    adoption: compose
    project_engineering: [workflow.requirement, workflow.implementation-gate]
    activation: {when: "公共接口、协议或持久化格式变更", profile_candidate: true}
    composition: {role: architect, primary: superpowers.writing-plans, outputs: [specification, acceptance-criteria]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.constraint-driven-development
    name: Constraint-Driven Development
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/constraint-driven-development/SKILL.md, license: MIT}
    capability: [constraints, risk-control, decision-boundaries]
    lifecycle: [requirement, architecture, design, implementation]
    adoption: adopt
    project_engineering: [policies, governance.architecture, workflow.routing]
    activation: {when: "存在平台、ABI、线程、性能、安全或兼容性约束", profile_candidate: true}
    composition: {role: engineering-standards, informs: [standards, quality_gates], outputs: [constraint-register]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.context-engineering
    name: Context Engineering
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/context-engineering/SKILL.md, license: MIT}
    capability: [context, repository-understanding, evidence-selection]
    lifecycle: [requirement, architecture, implementation, review]
    adoption: adopt
    project_engineering: [SKILL, PROJECT_CONTEXT, workflow.routing]
    activation: {when: "任务涉及陌生仓库、跨模块关系或上下文容易丢失", profile_candidate: true}
    composition: {role: workflow-manager, precedes: [superpowers.brainstorming, superpowers.writing-plans], outputs: [project-context-brief]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.source-driven-development
    name: Source-Driven Development
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/source-driven-development/SKILL.md, license: MIT}
    capability: [research, source-validation, claim-traceability]
    lifecycle: [requirement, architecture, design, review]
    adoption: adopt
    project_engineering: [registry, evaluations, governance]
    activation: {when: "需要外部规范、上游实现或事实依据", profile_candidate: true}
    composition: {role: architect, complements: [addy.context-engineering], outputs: [source-log, evidence-map]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.api-and-interface-design
    name: API and Interface Design
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/api-and-interface-design/SKILL.md, license: MIT}
    capability: [api-design, contracts, compatibility]
    lifecycle: [architecture, design, review]
    adoption: adopt
    project_engineering: [governance/design, policies, workflow/architecture-gate]
    activation: {when: "新增或修改公共 API、模块接口、信号槽或 QML 暴露面", profile_candidate: true}
    composition: {role: architect, references: [byliu-architecture-review], outputs: [interface-contract, compatibility-notes]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.incremental-implementation
    name: Incremental Implementation
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/incremental-implementation/SKILL.md, license: MIT}
    capability: [implementation, sequencing, reversible-change]
    lifecycle: [plan, implementation, delivery]
    adoption: compose
    project_engineering: [workflow.implementation-gate, technical-debt]
    activation: {when: "变更跨多个模块或需要降低回滚成本", profile_candidate: true}
    composition: {role: project-structure-manager, primary: superpowers.executing-plans, outputs: [incremental-slices, rollback-points]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.doubt-driven-development
    name: Doubt-Driven Development
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/doubt-driven-development/SKILL.md, license: MIT}
    capability: [assumption-testing, edge-cases, adversarial-review]
    lifecycle: [design, implementation, test, review]
    adoption: compose
    project_engineering: [workflow.test-gate, governance.review]
    activation: {when: "风险高、假设多或失败代价大", profile_candidate: false}
    composition: {role: test-engineer, complements: [superpowers.systematic-debugging, superpowers.verification-before-completion], outputs: [assumption-log, edge-case-tests]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.code-review-and-quality
    name: Code Review and Quality
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/code-review-and-quality/SKILL.md, license: MIT}
    capability: [review, maintainability, defect-detection]
    lifecycle: [review]
    adoption: compose
    project_engineering: [governance/review, workflow.review-gate]
    activation: {when: "需要质量审查或变更风险较高", profile_candidate: true}
    composition: {role: code-reviewer, primary: superpowers.requesting-code-review, benchmarks: [fluidframework-review]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.code-simplification
    name: Code Simplification
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/code-simplification/SKILL.md, license: MIT}
    capability: [refactoring, complexity-reduction, readability]
    lifecycle: [implementation, review]
    adoption: adopt
    project_engineering: [policies/complexity, governance/review]
    activation: {when: "行为保持重构或复杂度超过项目阈值", profile_candidate: true}
    composition: {role: engineering-standards, pairs_with: [superpowers.test-driven-development, superpowers.verification-before-completion], outputs: [simplification-diff, behavior-evidence]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.deprecation-and-migration
    name: Deprecation and Migration
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/deprecation-and-migration/SKILL.md, license: MIT}
    capability: [migration, compatibility, deprecation]
    lifecycle: [architecture, implementation, delivery]
    adoption: adopt
    project_engineering: [governance/architecture, technical-debt, workflow.review-gate]
    activation: {when: "替换公共 API、模块、依赖或持久化格式", profile_candidate: true}
    composition: {role: technical-debt-manager, requires: [addy.api-and-interface-design, superpowers.verification-before-completion], outputs: [migration-plan, deprecation-record]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.documentation-and-adrs
    name: Documentation and ADRs
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/documentation-and-adrs/SKILL.md, license: MIT}
    capability: [documentation, decisions, traceability]
    lifecycle: [architecture, design, delivery]
    adoption: adopt
    project_engineering: [templates/ADR, templates/ARCHITECTURE, roles/adr-manager]
    activation: {when: "存在架构取舍、公共约束、迁移或长期维护影响", profile_candidate: true}
    composition: {role: adr-manager, complements: [addy.source-driven-development], outputs: [ADR, architecture-record]}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.debugging-and-error-recovery
    name: Debugging and Error Recovery
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/debugging-and-error-recovery/SKILL.md, license: MIT}
    capability: [debugging, recovery, incident-analysis]
    lifecycle: [implementation, test, review]
    adoption: reference
    project_engineering: [workflow.test-gate]
    activation: {when: "需要比较不同调试方法", profile_candidate: false}
    composition: {primary: superpowers.systematic-debugging, reference_only: true, reason: "避免重复维护调试主流程"}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
  - id: addy.test-driven-development
    name: Test-Driven Development
    source: {id: addy-agent-skills, path: sources/github/addy-agent-skills/ORIGINAL/skills/test-driven-development/SKILL.md, license: MIT}
    capability: [testing, feedback-loop]
    lifecycle: [implementation, test]
    adoption: reference
    project_engineering: [workflow.test-gate]
    activation: {when: "需要比较测试方法", profile_candidate: false}
    composition: {primary: superpowers.test-driven-development, reference_only: true, reason: "Superpowers 是流程底座"}
    maturity: S1
    evidence: sources/github/addy-agent-skills/audit.md
