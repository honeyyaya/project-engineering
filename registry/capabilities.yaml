selection_rules:
  - "Use superpowers for workflow, TDD, debugging, planning and completion verification."
  - "Use addy-agent-skills for quality gates; prefer its code-review-and-quality for the five-axis review."
  - "Use FluidFramework review as a benchmark for high-confidence findings and API review structure."
  - "Use byliu architecture review before major platform, sync, bridge, sidecar or adapter decisions."
  - "Local C++/Qt/QML rules remain the domain adapter until an upstream source passes domain-specific evaluations."

overlap_policy:
  planning: "superpowers is the workflow source; Addy is a quality and decomposition reference. Do not run both planning flows automatically."
  testing: "superpowers owns RED-GREEN-REFACTOR; Addy supplies test strategy and quality checks."
  review: "Addy supplies the default quality gate; FluidFramework supplies benchmark questions and high-confidence thresholds."
  architecture: "byliu supplies greenfield/pivot challenge; local architecture rules supply C++/Qt evidence and output format."
